<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Détection de visage et alignement de la carte</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
      }

      /* Conteneur principal */
      .main-container {
        display: flex;
        flex-direction: column;
        width: 100vw; /* Toute la largeur de l’écran */
        height: 100vh; /* Toute la hauteur de l’écran */
      }

      /* Section du canvas */
      .canvas-container {
        width: 100%;
        height: 50vh; /* La moitié de la hauteur pour le canvas */
      }

      #canvas {
        width: 100%;
        height: 100%;
        display: block; /* Évite les marges indésirables */
      }

      /* Bloc inférieur */
      .bottom-container {
        display: flex;
        width: 100%;
        height: 50vh; /* La moitié restante pour l’aperçu et les métriques */
      }

      /* Aperçu de la photo */
      .photo-preview {
        width: 70%; /* 70% de la largeur */
        height: 100%;
      }

      #photoCanvas {
        width: 100%;
        height: 100%;
        border: 1px solid #ccc; /* Bordure légère pour visibilité */
      }

      /* Métriques */
      .metrics {
        width: 30%; /* 30% de la largeur */
        height: 100%;
        padding: 10px;
        background-color: #f5f5f5;
        overflow-y: auto; /* Défilement si trop de contenu */
      }

      .metric-row {
        margin-bottom: 10px;
        font-size: 14px; /* Taille adaptée pour mobile */
        border-bottom: 1px solid #ddd;
      }

      /* Checkboxes */
      .checkboxes {
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 10px;
      }

      .checkboxes label {
        display: flex;
        align-items: center;
        gap: 5px;
      }

      /* Boutons */
      button {
        width: 100%;
        padding: 15px;
        font-size: 18px; /* Plus grand pour mobile */
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      button:hover {
        background-color: #45a049;
      }

      /* Navigation */
      .nav-menu {
        background-color: #333;
        padding: 15px 0;
      }

      .nav-menu ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        gap: 20px;
      }

      .nav-menu a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 8px 15px;
        border-radius: 4px;
        transition: background-color 0.3s;
      }

      .nav-menu a:hover {
        background-color: #555;
      }

      .nav-menu a.active {
        background-color: #4caf50;
      }

      /* Classes de statut */
      .status-good {
        color: green;
      }

      .status-warning {
        color: orange;
      }

      .status-bad {
        color: red;
      }
    </style>
  </head>
  <body>
    <nav class="nav-menu">
      <ul>
        <li><a href="index.html" class="active">Prise de photo</a></li>
        <li><a href="analyse.html">Analyse d'image</a></li>
      </ul>
    </nav>
    <h1>Détection de visage et alignement de la carte</h1>
    <div class="main-container">
      <!-- Section du canvas principal -->
      <div class="canvas-container">
        <canvas id="canvas" willReadFrequently="true"></canvas>
      </div>
      <!-- Bloc inférieur avec aperçu et métriques -->
      <div class="bottom-container">
        <div class="photo-preview">
          <canvas id="photoCanvas"></canvas>
        </div>
        <div class="metrics">
          <div class="metric-row">
            <p>Angle de la carte: <span id="cardAngleValue">-</span></p>
          </div>
          <div class="metric-row">
            <p>Alignement visage-carte: <span id="alignmentValue">-</span></p>
          </div>
          <div class="metric-row">
            <p>Distance caméra-carte: <span id="distanceValue">-</span></p>
          </div>
          <div class="metric-row">
            <p>Luminosité: <span id="brightnessValue">-</span></p>
          </div>
          <div class="metric-row">
            <p>Variance (netteté): <span id="varianceValue">-</span></p>
          </div>
          <div class="metric-row">
            <p>Statut global: <span id="resultStatus">-</span></p>
          </div>
          <div class="metric-row">
            <p>
              Alignement de la carte: <span id="eyesAlignmentValue">-</span>
            </p>
          </div>
        </div>
      </div>
    </div>
    <div class="checkboxes">
      <label
        ><input type="checkbox" id="showGuide" checked /> Afficher le
        guide</label
      >
      <label
        ><input type="checkbox" id="showDebug" /> Afficher les infos
        debug</label
      >
      <label
        ><input type="checkbox" id="useContourDetection" /> Utiliser la
        détection de contour</label
      >
      <label
        ><input type="checkbox" id="showEyes" checked /> Afficher la détection
        des yeux</label
      >
      <label
        ><input type="checkbox" id="autoCapture" checked /> Prise automatique de
        photo</label
      >
    </div>
    <button id="manualCapture">Prendre la photo manuellement</button>
    <button id="retakePhoto" style="display: none">Reprendre la photo</button>
    <video id="video" autoplay style="display: none"></video>
    <script src="src/js/card.js"></script>
    <script
      async
      src="https://docs.opencv.org/4.11.0/opencv.js"
      onload="onOpenCvReady();"
    ></script>
  </body>
</html>
