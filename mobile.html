<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caméra Mobile</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #options {
        position: fixed;
        top: 10px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        z-index: 100;
      }
      .checkboxes {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        background-color: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 10px;
        margin: 0 10px;
      }
      .checkboxes label {
        display: flex;
        align-items: center;
        gap: 5px;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }
      .checkboxes input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #4caf50;
      }
      #canvas {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        font-size: 24px;
        z-index: 999;
      }
      #captureBtn {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        background-color: #ff4d4d;
        color: white;
        border: none;
        border-radius: 50px;
        font-size: 18px;
        z-index: 10;
      }
      #photoScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      #photoCanvas {
        max-width: 90%;
        max-height: 70%;
        object-fit: contain;
        cursor: pointer;
      }
      #photoMetrics {
        color: white;
        background-color: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
        margin-top: 10px;
        font-size: 14px;
        max-width: 90%;
        text-align: center;
      }

      .photoButtons {
        display: flex;
        justify-content: space-around;
        width: 100%;
        margin-top: 20px;
      }
      .photoButtons button {
        padding: 12px 25px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        margin: 0 10px;
      }
      #confirmPhoto {
        background-color: #4caf50;
        color: white;
      }
      #retakePhoto {
        background-color: #f44336;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      Chargement d'OpenCV...<br />Touchez l'écran après le chargement si la
      caméra ne démarre pas
    </div>

    <div id="options">
      <div class="checkboxes">
        <label>
          <input type="checkbox" id="showFace" checked />
          Visage
        </label>
        <label>
          <input type="checkbox" id="showCard" checked />
          Carte
        </label>
        <label>
          <input type="checkbox" id="showGuide" checked />
          Guide
        </label>
        <label>
          <input type="checkbox" id="autoCapture" checked />
          Capture auto
        </label>
      </div>
    </div>

    <canvas id="canvas"></canvas>
    <video id="video" autoplay playsinline muted style="display: none"></video>
    <button id="captureBtn">Prendre la photo</button>

    <div id="photoScreen">
      <canvas id="photoCanvas"></canvas>
      <div id="photoMetrics"></div>
      <div class="photoButtons">
        <button id="confirmPhoto">Valider</button>
        <button id="retakePhoto">Reprendre</button>
      </div>
    </div>

    <script></script>

    <!-- Chargement d'OpenCV.js -->
    <script src="src/js/mobile.js"></script>
    <script
      async
      src="https://docs.opencv.org/4.11.0/opencv.js"
      onload="onOpenCvReady();"
    ></script>
  </body>
</html>
