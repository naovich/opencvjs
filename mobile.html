<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Caméra Mobile</title>
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      #options {
        position: fixed;
        top: 10px;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        z-index: 100;
      }
      .checkboxes {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        background-color: rgba(0, 0, 0, 0.5);
        padding: 10px;
        border-radius: 10px;
        margin: 0 10px;
      }
      .checkboxes label {
        display: flex;
        align-items: center;
        gap: 5px;
        color: white;
        font-size: 14px;
        cursor: pointer;
      }
      .checkboxes input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #4caf50;
      }
      #canvas {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      #loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        font-size: 24px;
        z-index: 999;
      }
      #captureBtn {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        background-color: #ff4d4d;
        color: white;
        border: none;
        border-radius: 50px;
        font-size: 18px;
        z-index: 10;
      }
      #photoScreen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }
      #photoCanvas {
        max-width: 90%;
        max-height: 70%;
        object-fit: contain;
        cursor: pointer;
      }
      #photoMetrics {
        color: white;
        background-color: rgba(0, 0, 0, 0.7);
        padding: 10px;
        border-radius: 5px;
        margin-top: 10px;
        font-size: 14px;
        max-width: 90%;
        text-align: center;
      }
      #zoomModal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.9);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 2000;
      }
      #zoomCanvas {
        touch-action: none;
      }
      .zoomControls {
        display: flex;
        justify-content: center;
        margin-top: 20px;
        width: 100%;
      }
      .zoomControls button {
        padding: 10px 20px;
        margin: 0 10px;
        background-color: #333;
        color: white;
        border: none;
        border-radius: 5px;
      }
      .photoButtons {
        display: flex;
        justify-content: space-around;
        width: 100%;
        margin-top: 20px;
      }
      .photoButtons button {
        padding: 12px 25px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        margin: 0 10px;
      }
      #confirmPhoto {
        background-color: #4caf50;
        color: white;
      }
      #retakePhoto {
        background-color: #f44336;
        color: white;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      Chargement d'OpenCV...<br />Touchez l'écran après le chargement si la
      caméra ne démarre pas
    </div>

    <div id="options">
      <div class="checkboxes">
        <label>
          <input type="checkbox" id="showFace" checked />
          Visage
        </label>
        <label>
          <input type="checkbox" id="showCard" checked />
          Carte
        </label>
        <label>
          <input type="checkbox" id="showGuide" checked />
          Guide
        </label>
        <label>
          <input type="checkbox" id="autoCapture" checked />
          Capture auto
        </label>
      </div>
    </div>

    <canvas id="canvas"></canvas>
    <video id="video" autoplay playsinline muted style="display: none"></video>
    <button id="captureBtn">Prendre la photo</button>

    <div id="photoScreen">
      <canvas id="photoCanvas"></canvas>
      <div id="photoMetrics"></div>
      <div class="photoButtons">
        <button id="confirmPhoto">Valider</button>
        <button id="retakePhoto">Reprendre</button>
      </div>
    </div>

    <div id="zoomModal">
      <canvas id="zoomCanvas"></canvas>
      <div class="zoomControls">
        <button id="zoomIn">Zoom +</button>
        <button id="zoomOut">Zoom -</button>
        <button id="closeZoom">Fermer</button>
      </div>
    </div>

    <script>
      // Variables pour le canvas et la vidéo
      let canvas, ctx, video, photoCanvas, photoCtx;
      let openCv = null;
      let faceClassifier = null;
      let eyeClassifier = null;
      let lastFaceRect = null;
      let lastCardRect = null;
      let photoTaken = false;
      let autoCaptureEnabled = true;
      let showFace = true;
      let showCard = true;
      let showGuide = true;
      let captureMetrics = {};
      let zoomScale = 1;
      let zoomOffsetX = 0;
      let zoomOffsetY = 0;
      let isDragging = false;
      let lastX = 0;
      let lastY = 0;

      // Constantes pour les métriques
      const BRIGHTNESS_MIN = 50;
      const BRIGHTNESS_MAX = 200;
      const VARIANCE_MIN = 50;

      // Constantes
      const CARD_RATIO = 85.6 / 53.98; // Ratio standard d'une carte d'identité
      const CAPTURE_WIDTH = 1280;
      const CAPTURE_HEIGHT = 720;

      // Fonction appelée lorsque OpenCV est chargé
      async function onOpenCvReady() {
        console.log("OpenCV.js est prêt.");
        document.getElementById("loading").style.display = "none";
        openCv = await cv;
        initCamera();
      }

      // Initialisation de la caméra
      function initCamera() {
        video = document.getElementById("video");
        canvas = document.getElementById("canvas");
        ctx = canvas.getContext("2d");
        photoCanvas = document.getElementById("photoCanvas");
        photoCtx = photoCanvas.getContext("2d");

        // Ajuster la taille du canvas à la fenêtre
        function resizeCanvas() {
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;

          // Configurer la taille du photoCanvas
          photoCanvas.width = CAPTURE_WIDTH;
          photoCanvas.height = CAPTURE_HEIGHT;
        }

        // Appeler resizeCanvas au chargement et au redimensionnement
        window.addEventListener("resize", resizeCanvas);
        resizeCanvas();

        // Accéder à la caméra (préférer la caméra arrière sur mobile)
        const constraints = {
          audio: false,
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: CAPTURE_WIDTH },
            height: { ideal: CAPTURE_HEIGHT },
          },
        };

        // Fonction pour démarrer la vidéo avec interaction utilisateur sur iOS
        function startVideoPlayback() {
          if (video.paused) {
            video
              .play()
              .then(() => {
                console.log("Lecture vidéo démarrée avec succès");
                // Retirer l'écouteur d'événement une fois la vidéo démarrée
                document.removeEventListener("touchend", startVideoPlayback);
              })
              .catch((err) => {
                console.error("Erreur lors du démarrage de la vidéo:", err);
              });
          }
        }

        // Ajouter un écouteur d'événement pour iOS
        document.addEventListener("touchend", startVideoPlayback);

        navigator.mediaDevices
          .getUserMedia(constraints)
          .then(function (stream) {
            video.srcObject = stream;
            video.onloadedmetadata = function () {
              // Essayer de démarrer la lecture automatiquement
              video
                .play()
                .then(() => {
                  console.log("Lecture vidéo démarrée automatiquement");
                })
                .catch((e) => {
                  console.log(
                    "Lecture automatique impossible, attente d'interaction utilisateur",
                    e
                  );
                  // L'utilisateur devra toucher l'écran pour démarrer la vidéo sur iOS
                });

              // Commencer le traitement vidéo
              requestAnimationFrame(processVideo);
            };
          })
          .catch(function (err) {
            console.error("Erreur d'accès à la caméra: ", err);
            alert(
              "Impossible d'accéder à la caméra. Veuillez autoriser l'accès à la caméra et recharger la page."
            );
          });

        // Configurer les événements pour les boutons
        document
          .getElementById("captureBtn")
          .addEventListener("click", () => capturePhoto("manuel"));
        document
          .getElementById("retakePhoto")
          .addEventListener("click", retakePhoto);
        document
          .getElementById("confirmPhoto")
          .addEventListener("click", confirmPhoto);
        document
          .getElementById("photoCanvas")
          .addEventListener("click", openZoomModal);
        document
          .getElementById("zoomIn")
          .addEventListener("click", () => zoomImage(0.1));
        document
          .getElementById("zoomOut")
          .addEventListener("click", () => zoomImage(-0.1));
        document
          .getElementById("closeZoom")
          .addEventListener("click", closeZoomModal);

        // Configurer les événements pour les options
        document.getElementById("showFace").addEventListener("change", (e) => {
          showFace = e.target.checked;
        });
        document.getElementById("showCard").addEventListener("change", (e) => {
          showCard = e.target.checked;
        });
        document.getElementById("showGuide").addEventListener("change", (e) => {
          showGuide = e.target.checked;
        });
        document
          .getElementById("autoCapture")
          .addEventListener("change", (e) => {
            autoCaptureEnabled = e.target.checked;
          });

        // Configurer les événements pour le zoom et le déplacement
        const zoomCanvas = document.getElementById("zoomCanvas");
        zoomCanvas.addEventListener("mousedown", startDrag);
        zoomCanvas.addEventListener("mousemove", drag);
        zoomCanvas.addEventListener("mouseup", endDrag);
        zoomCanvas.addEventListener("mouseleave", endDrag);
        zoomCanvas.addEventListener("touchstart", startDragTouch);
        zoomCanvas.addEventListener("touchmove", dragTouch);
        zoomCanvas.addEventListener("touchend", endDragTouch);
      }

      // Chargement du classificateur pour la détection de visage
      async function loadFaceClassifier() {
        try {
          const response = await fetch(
            "src/classifiers/haarcascade_frontalface_default.xml"
          );
          const buffer = await response.arrayBuffer();
          const data = new Uint8Array(buffer);
          openCv.FS_createDataFile(
            "/",
            "haarcascade_frontalface_default.xml",
            data,
            true,
            false,
            false
          );
          let classifier = new openCv.CascadeClassifier();
          classifier.load("haarcascade_frontalface_default.xml");
          return classifier;
        } catch (error) {
          console.error(
            "Erreur lors du chargement du classificateur de visage:",
            error
          );
          return null;
        }
      }

      // Chargement du classificateur pour la détection des yeux
      async function loadEyeClassifier() {
        try {
          const response = await fetch("src/classifiers/haarcascade_eye.xml");
          const buffer = await response.arrayBuffer();
          const data = new Uint8Array(buffer);
          openCv.FS_createDataFile(
            "/",
            "haarcascade_eye.xml",
            data,
            true,
            false,
            false
          );
          let classifier = new openCv.CascadeClassifier();
          classifier.load("haarcascade_eye.xml");
          return classifier;
        } catch (error) {
          console.error(
            "Erreur lors du chargement du classificateur des yeux:",
            error
          );
          return null;
        }
      }

      // Détection de visage
      async function detectFace(src, gray) {
        if (!faceClassifier) {
          faceClassifier = await loadFaceClassifier();
          if (!faceClassifier) return null;
        }

        let faces = new openCv.RectVector();
        faceClassifier.detectMultiScale(gray, faces, 1.3, 5, 0);

        let currentFaceRect = null;
        if (faces.size() > 0) {
          // Prendre le plus grand visage ou celui le plus au centre
          let bestFace = null;
          let bestScore = 0;

          for (let i = 0; i < faces.size(); i++) {
            let face = faces.get(i);
            let area = face.width * face.height;
            let centerX = face.x + face.width / 2;
            let centerY = face.y + face.height / 2;
            let distanceFromCenter = Math.sqrt(
              Math.pow(centerX - gray.cols / 2, 2) +
                Math.pow(centerY - gray.rows / 2, 2)
            );
            let score = area * (1 - distanceFromCenter / (gray.cols / 2));

            if (score > bestScore) {
              bestScore = score;
              bestFace = face;
            }
          }

          if (bestFace) {
            currentFaceRect = {
              x: bestFace.x,
              y: bestFace.y,
              width: bestFace.width,
              height: bestFace.height,
            };

            // Dessiner le rectangle du visage si l'option est activée
            if (showFace) {
              let pt1 = new openCv.Point(currentFaceRect.x, currentFaceRect.y);
              let pt2 = new openCv.Point(
                currentFaceRect.x + currentFaceRect.width,
                currentFaceRect.y + currentFaceRect.height
              );
              openCv.rectangle(src, pt1, pt2, [0, 255, 0, 255], 2);
            }
          }
        }

        faces.delete();
        lastFaceRect = currentFaceRect;
        return currentFaceRect;
      }

      // Détection des yeux
      async function detectEyes(src, faceRect) {
        if (!faceRect) return [];
        if (!eyeClassifier) {
          eyeClassifier = await loadEyeClassifier();
          if (!eyeClassifier) return [];
        }

        try {
          let faceROI = src.roi(
            new openCv.Rect(
              faceRect.x,
              faceRect.y,
              faceRect.width,
              faceRect.height
            )
          );
          let grayFace = new openCv.Mat();
          openCv.cvtColor(faceROI, grayFace, openCv.COLOR_RGBA2GRAY);

          let eyes = new openCv.RectVector();
          eyeClassifier.detectMultiScale(
            grayFace,
            eyes,
            1.1,
            5,
            0,
            new openCv.Size(20, 20)
          );

          let eyesArray = [];
          for (let i = 0; i < eyes.size(); i++) {
            let eye = eyes.get(i);
            eyesArray.push({
              x: eye.x,
              y: eye.y,
              width: eye.width,
              height: eye.height,
              score: eye.y * 1000 + eye.width * eye.height,
            });
          }

          // Trier par position verticale et taille
          eyesArray.sort((a, b) => a.score - b.score);

          // Filtrer pour ne garder que les yeux dans la moitié supérieure du visage
          eyesArray = eyesArray.filter((eye) => eye.y < faceRect.height * 0.5);

          // Garder les deux premiers yeux seulement
          let selectedEyes = eyesArray.slice(0, 2);

          // Si on a deux yeux, les trier de gauche à droite
          if (selectedEyes.length === 2) {
            selectedEyes.sort((a, b) => a.x - b.x);

            // Dessiner les rectangles des yeux si l'option d'affichage du visage est activée
            if (showFace) {
              selectedEyes.forEach((eye) => {
                let eyeRect = new openCv.Rect(
                  faceRect.x + eye.x,
                  faceRect.y + eye.y,
                  eye.width,
                  eye.height
                );
                let pt1 = new openCv.Point(eyeRect.x, eyeRect.y);
                let pt2 = new openCv.Point(
                  eyeRect.x + eyeRect.width,
                  eyeRect.y + eyeRect.height
                );
                openCv.rectangle(src, pt1, pt2, [238, 130, 238, 255], 2);
              });
            }

            // Dessiner la ligne entre les yeux
            let leftEye = selectedEyes[0];
            let rightEye = selectedEyes[1];

            let leftEyeCenter = {
              x: faceRect.x + leftEye.x + leftEye.width / 2,
              y: faceRect.y + leftEye.y + leftEye.height / 2,
            };

            let rightEyeCenter = {
              x: faceRect.x + rightEye.x + rightEye.width / 2,
              y: faceRect.y + rightEye.y + rightEye.height / 2,
            };

            // Dessiner la ligne entre les yeux si l'option d'affichage du visage est activée
            if (showFace) {
              openCv.line(
                src,
                new openCv.Point(leftEyeCenter.x, leftEyeCenter.y),
                new openCv.Point(rightEyeCenter.x, rightEyeCenter.y),
                [0, 255, 255, 255],
                2
              );
            }
          }

          eyes.delete();
          grayFace.delete();
          faceROI.delete();

          return selectedEyes;
        } catch (err) {
          console.error("Erreur dans detectEyes:", err);
          return [];
        }
      }

      // Extrapolation du rectangle de la carte à partir du visage
      function extrapolateCardRectangle(faceRect) {
        const s = 3.2;
        const offsetX = -15;
        const offsetY = -10;
        let cardHeight = faceRect.height * s;
        let cardWidth = cardHeight * CARD_RATIO;
        let cardX = faceRect.x - faceRect.width * 0.4 + offsetX;
        let faceCenterY = faceRect.y + faceRect.height / 2;
        let cardY = faceCenterY - cardHeight / 2 + offsetY;
        return { x: cardX, y: cardY, width: cardWidth, height: cardHeight };
      }

      // Capture de la photo
      function capturePhoto(mode = "auto") {
        if (!lastFaceRect) {
          console.log("Capture impossible : aucun visage détecté");
          return;
        }

        try {
          // Extrapoler le rectangle de la carte
          let extrapolatedCardRect = extrapolateCardRectangle(lastFaceRect);
          let lastCardRect = extrapolatedCardRect; // Utiliser le rectangle extrapolé

          // Enregistrer les métriques de capture
          const alignmentResult = calculateAlignment(lastFaceRect, extrapolatedCardRect);
          const distanceResult = calculateDistance(extrapolatedCardRect);
          const imageQuality = analyzeImageQuality();
          
          captureMetrics = {
            mode: mode,
            faceRect: { ...lastFaceRect },
            cardRect: { ...extrapolatedCardRect },
            alignment: alignmentResult.message,
            distance: distanceResult.message,
            brightness: imageQuality.brightness,
            variance: imageQuality.variance,
            cardAngle: alignmentResult.angle
          };

          if (video.readyState === 4) {
            // Récupérer les dimensions et positions actuelles de la vidéo dans le canvas
            const videoRatio = video.videoWidth / video.videoHeight;
            const canvasRatio = canvas.width / canvas.height;
            let drawWidth,
              drawHeight,
              offsetX = 0,
              offsetY = 0;

            if (videoRatio > canvasRatio) {
              // La vidéo est plus large que le canvas
              drawHeight = canvas.height;
              drawWidth =
                video.videoWidth * (canvas.height / video.videoHeight);
              offsetX = (canvas.width - drawWidth) / 2;
            } else {
              // La vidéo est plus haute que le canvas
              drawWidth = canvas.width;
              drawHeight =
                video.videoHeight * (canvas.width / video.videoWidth);
              offsetY = (canvas.height - drawHeight) / 2;
            }

            // Calculer les coordonnées proportionnelles dans la vidéo originale
            const scaleX = video.videoWidth / drawWidth;
            const scaleY = video.videoHeight / drawHeight;

            // Ajuster les coordonnées du rectangle par rapport à la vidéo originale
            const sourceX = (lastCardRect.x - offsetX) * scaleX;
            const sourceY = (lastCardRect.y - offsetY) * scaleY;
            const sourceWidth = lastCardRect.width * scaleX;
            const sourceHeight = lastCardRect.height * scaleY;

            // Capturer depuis la vidéo avec les coordonnées ajustées
            photoCtx.clearRect(0, 0, photoCanvas.width, photoCanvas.height);
            photoCtx.drawImage(
              video,
              Math.max(0, sourceX),
              Math.max(0, sourceY),
              Math.min(sourceWidth, video.videoWidth),
              Math.min(sourceHeight, video.videoHeight),
              0,
              0,
              photoCanvas.width,
              photoCanvas.height
            );

            // Améliorer la qualité de l'image
            photoCtx.filter = "contrast(1.1) brightness(1.05)";
            photoCtx.imageSmoothingEnabled = true;
            photoCtx.imageSmoothingQuality = "high";

            // Afficher l'écran de photo
            document.getElementById("photoScreen").style.display = "flex";
            photoTaken = true;

            // Afficher les métriques de capture
            const metricsDiv = document.getElementById("photoMetrics");
            
            // Évaluer la qualité des métriques pour l'affichage
            const brightnessStatus = captureMetrics.brightness >= BRIGHTNESS_MIN && captureMetrics.brightness <= BRIGHTNESS_MAX ? "Bonne" : 
                                    captureMetrics.brightness < BRIGHTNESS_MIN ? "Trop sombre" : "Trop claire";
            
            const varianceStatus = captureMetrics.variance >= VARIANCE_MIN ? "Bonne" : "Insuffisante";
            
            metricsDiv.innerHTML = `
              <strong>Mode de capture:</strong> ${captureMetrics.mode === 'auto' ? 'Automatique' : 'Manuel'}<br>
              <strong>Alignement visage-carte:</strong> ${captureMetrics.alignment || 'Non mesuré'}<br>
              <strong>Distance caméra-carte:</strong> ${captureMetrics.distance || 'Non mesurée'}<br>
              <strong>Luminosité:</strong> ${captureMetrics.brightness} (${brightnessStatus})<br>
              <strong>Netteté:</strong> ${captureMetrics.variance} (${varianceStatus})<br>
              <strong>Alignement de la carte:</strong> ${captureMetrics.cardAngle ? captureMetrics.cardAngle.toFixed(1) + '°' : 'Non mesuré'}
            `;

            console.log("Photo capturée");
          }
        } catch (err) {
          console.error("Erreur lors de la capture:", err);
        }
      }

      // Reprendre la photo
      function retakePhoto() {
        document.getElementById("photoScreen").style.display = "none";
        photoTaken = false;
        // Restaurer l'état de la capture automatique en fonction de la checkbox
        autoCaptureEnabled = document.getElementById("autoCapture").checked;
      }

      // Confirmer la photo
      function confirmPhoto() {
        alert(
          "Photo validée! Vous pouvez implémenter ici l'action souhaitée (envoi au serveur, etc.)"
        );
      }

      // Fonctions pour calculer les métriques
      function calculateAlignment(faceRect, cardRect) {
        if (!faceRect || !cardRect) {
          return {
            aligned: false,
            message: "Impossible de vérifier l'alignement"
          };
        }
        
        // Calculer les centres
        const faceCenterX = faceRect.x + faceRect.width / 2;
        const faceCenterY = faceRect.y + faceRect.height / 2;
        const cardCenterX = cardRect.x + cardRect.width / 2;
        
        // Vérifier si le visage est centré horizontalement dans la carte
        const horizontalOffset = Math.abs(faceCenterX - cardCenterX);
        const maxOffset = cardRect.width * 0.1; // 10% de la largeur de la carte
        
        const isAligned = horizontalOffset <= maxOffset;
        const angle = 0; // Angle fixe pour cette version simplifiée
        
        if (isAligned) {
          return {
            aligned: true,
            angle: angle,
            message: "Alignement correct"
          };
        } else if (faceCenterX < cardCenterX) {
          return {
            aligned: false,
            angle: angle,
            message: "Visage trop à gauche"
          };
        } else {
          return {
            aligned: false,
            angle: angle,
            message: "Visage trop à droite"
          };
        }
      }

      function calculateDistance(cardRect) {
        if (!cardRect) {
          return { 
            correct: false, 
            message: "Distance indéterminée" 
          };
        }
        
        // Calculer le rectangle guide pour la distance optimale
        const guideRect = {
          x: Math.round(canvas.width / 2 - (canvas.width * GUIDE_RECT_FACTOR_WIDTH) / 2),
          y: Math.round(canvas.height / 2 - (canvas.height * GUIDE_RECT_FACTOR_HEIGHT) / 2),
          width: Math.round(canvas.width * GUIDE_RECT_FACTOR_WIDTH),
          height: Math.round(canvas.height * GUIDE_RECT_FACTOR_HEIGHT)
        };
        
        // Calculer l'intersection entre la carte et le guide
        const intersectionArea = calculateIntersection(cardRect, guideRect);
        const cardArea = cardRect.width * cardRect.height;
        const guideArea = guideRect.width * guideRect.height;
        const cardOverlapRatio = intersectionArea / cardArea;
        const guideOverlapRatio = intersectionArea / guideArea;
        
        const OVERLAP_THRESHOLD = 0.7; // Seuil de chevauchement pour la distance
        
        if (cardOverlapRatio > OVERLAP_THRESHOLD && guideOverlapRatio > 0.5) {
          return {
            correct: true,
            message: "Distance optimale",
            area: cardArea,
            overlap: cardOverlapRatio
          };
        } else if (cardArea < guideArea * 0.6) {
          return {
            correct: false,
            message: "Trop loin",
            area: cardArea,
            overlap: cardOverlapRatio
          };
        } else if (cardArea > guideArea * 1.4) {
          return {
            correct: false,
            message: "Trop proche",
            area: cardArea,
            overlap: cardOverlapRatio
          };
        } else {
          return {
            correct: false,
            message: "Ajuster la position",
            area: cardArea,
            overlap: cardOverlapRatio
          };
        }
      }
      
      // Fonction pour calculer l'intersection entre deux rectangles
      function calculateIntersection(rect1, rect2) {
        const x1 = Math.max(rect1.x, rect2.x);
        const y1 = Math.max(rect1.y, rect2.y);
        const x2 = Math.min(rect1.x + rect1.width, rect2.x + rect2.width);
        const y2 = Math.min(rect1.y + rect1.height, rect2.y + rect2.height);
        
        if (x1 >= x2 || y1 >= y2) return 0;
        return (x2 - x1) * (y2 - y1);
      }

      function calculateBrightness() {
        try {
          // Créer un canvas temporaire pour l'analyse
          const tempCanvas = document.createElement('canvas');
          const tempCtx = tempCanvas.getContext('2d');
          tempCanvas.width = 50; // Petite taille pour l'analyse
          tempCanvas.height = 50;
          
          // Dessiner une partie de la vidéo sur le canvas temporaire
          tempCtx.drawImage(video, video.videoWidth/2 - 25, video.videoHeight/2 - 25, 50, 50, 0, 0, 50, 50);
          
          // Obtenir les données de l'image
          const imageData = tempCtx.getImageData(0, 0, 50, 50);
          const data = imageData.data;
          
          // Calculer la luminosité moyenne
          let sum = 0;
          for (let i = 0; i < data.length; i += 4) {
            // Formule standard pour convertir RGB en luminosité
            // 0.299 * R + 0.587 * G + 0.114 * B
            sum += (0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
          }
          
          const brightness = Math.round(sum / (data.length / 4));
          
          return brightness;
        } catch (err) {
          console.error("Erreur dans calculateBrightness:", err);
          return 0;
        }
      }

      function calculateVariance() {
        try {
          // Créer un canvas temporaire pour l'analyse
          const tempCanvas = document.createElement('canvas');
          const tempCtx = tempCanvas.getContext('2d');
          tempCanvas.width = 50; // Petite taille pour l'analyse
          tempCanvas.height = 50;
          
          // Dessiner une partie de la vidéo sur le canvas temporaire
          tempCtx.drawImage(video, video.videoWidth/2 - 25, video.videoHeight/2 - 25, 50, 50, 0, 0, 50, 50);
          
          // Obtenir les données de l'image
          const imageData = tempCtx.getImageData(0, 0, 50, 50);
          const data = imageData.data;
          
          // Convertir en niveaux de gris et calculer la moyenne
          const grayValues = [];
          let sum = 0;
          
          for (let i = 0; i < data.length; i += 4) {
            const gray = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
            grayValues.push(gray);
            sum += gray;
          }
          
          const mean = sum / grayValues.length;
          
          // Calculer la variance (écart-type au carré)
          let sumSquaredDiff = 0;
          for (let i = 0; i < grayValues.length; i++) {
            const diff = grayValues[i] - mean;
            sumSquaredDiff += diff * diff;
          }
          
          const variance = Math.round(sumSquaredDiff / grayValues.length);
          
          return variance;
        } catch (err) {
          console.error("Erreur dans calculateVariance:", err);
          return 0;
        }
      }
      
      // Fonction pour analyser la qualité de l'image
      function analyzeImageQuality() {
        const brightness = calculateBrightness();
        const variance = calculateVariance();
        
        return {
          brightness: brightness,
          variance: variance
        };
      }

      function calculateCardAngle(cardRect) {
        if (!cardRect) return null;

        // Dans cette version simplifiée, nous supposons que la carte est horizontale
        // Une implémentation plus avancée utiliserait OpenCV pour détecter l'angle réel
        return 0;
      }

      // Fonctions pour le zoom et le déplacement de l'image
      function openZoomModal() {
        const photoCanvas = document.getElementById("photoCanvas");
        const zoomCanvas = document.getElementById("zoomCanvas");
        const zoomModal = document.getElementById("zoomModal");

        // Réinitialiser le zoom et le déplacement
        zoomScale = 1;
        zoomOffsetX = 0;
        zoomOffsetY = 0;

        // Définir les dimensions du canvas de zoom
        zoomCanvas.width = window.innerWidth * 0.9;
        zoomCanvas.height = window.innerHeight * 0.7;

        // Dessiner l'image sur le canvas de zoom
        const zoomCtx = zoomCanvas.getContext("2d");
        zoomCtx.clearRect(0, 0, zoomCanvas.width, zoomCanvas.height);
        zoomCtx.drawImage(
          photoCanvas,
          0,
          0,
          zoomCanvas.width,
          zoomCanvas.height
        );

        // Afficher le modal
        zoomModal.style.display = "flex";
      }

      function closeZoomModal() {
        document.getElementById("zoomModal").style.display = "none";
      }

      function zoomImage(delta) {
        const oldScale = zoomScale;
        zoomScale = Math.max(1, Math.min(5, zoomScale + delta));

        // Ajuster le déplacement pour maintenir le centre
        const zoomCanvas = document.getElementById("zoomCanvas");
        const centerX = zoomCanvas.width / 2;
        const centerY = zoomCanvas.height / 2;

        zoomOffsetX =
          (zoomOffsetX - centerX) * (zoomScale / oldScale) + centerX;
        zoomOffsetY =
          (zoomOffsetY - centerY) * (zoomScale / oldScale) + centerY;

        redrawZoomCanvas();
      }

      function startDrag(e) {
        isDragging = true;
        lastX = e.clientX;
        lastY = e.clientY;
      }

      function drag(e) {
        if (!isDragging) return;

        const deltaX = e.clientX - lastX;
        const deltaY = e.clientY - lastY;

        zoomOffsetX += deltaX;
        zoomOffsetY += deltaY;

        lastX = e.clientX;
        lastY = e.clientY;

        redrawZoomCanvas();
      }

      function endDrag() {
        isDragging = false;
      }

      function startDragTouch(e) {
        if (e.touches.length === 1) {
          isDragging = true;
          lastX = e.touches[0].clientX;
          lastY = e.touches[0].clientY;
        }
      }

      function dragTouch(e) {
        if (!isDragging || e.touches.length !== 1) return;

        const deltaX = e.touches[0].clientX - lastX;
        const deltaY = e.touches[0].clientY - lastY;

        zoomOffsetX += deltaX;
        zoomOffsetY += deltaY;

        lastX = e.touches[0].clientX;
        lastY = e.touches[0].clientY;

        redrawZoomCanvas();
        e.preventDefault();
      }

      function endDragTouch() {
        isDragging = false;
      }

      function redrawZoomCanvas() {
        const photoCanvas = document.getElementById("photoCanvas");
        const zoomCanvas = document.getElementById("zoomCanvas");
        const zoomCtx = zoomCanvas.getContext("2d");

        // Effacer le canvas
        zoomCtx.clearRect(0, 0, zoomCanvas.width, zoomCanvas.height);

        // Calculer les dimensions et positions pour le zoom
        const scaledWidth = zoomCanvas.width * zoomScale;
        const scaledHeight = zoomCanvas.height * zoomScale;

        // Dessiner l'image avec zoom et déplacement
        zoomCtx.save();
        zoomCtx.translate(zoomOffsetX, zoomOffsetY);
        zoomCtx.scale(zoomScale, zoomScale);
        zoomCtx.drawImage(
          photoCanvas,
          -zoomCanvas.width / 2 / zoomScale + zoomCanvas.width / 2 / zoomScale,
          -zoomCanvas.height / 2 / zoomScale +
            zoomCanvas.height / 2 / zoomScale,
          zoomCanvas.width / zoomScale,
          zoomCanvas.height / zoomScale
        );
        zoomCtx.restore();
      }

      // Dessiner le rectangle guide pour la carte
      function drawCardGuide(ctx, width, height) {
        // Calculer les dimensions du rectangle guide
        const guideWidth = width * 0.85; // 85% de la largeur de l'écran
        const guideHeight = guideWidth / CARD_RATIO;

        // Calculer la position pour centrer le rectangle
        const guideX = (width - guideWidth) / 2;
        const guideY = (height - guideHeight) / 2;

        // Dessiner le rectangle guide
        ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(guideX, guideY, guideWidth, guideHeight);
        ctx.setLineDash([]);

        return { x: guideX, y: guideY, width: guideWidth, height: guideHeight };
      }

      // Traitement de la vidéo avec OpenCV
      async function processVideo() {
        try {
          // Vérifier si la vidéo est en cours de lecture
          if (
            video.readyState === video.HAVE_ENOUGH_DATA &&
            openCv &&
            typeof openCv !== "undefined"
          ) {
            // Ajuster le ratio pour maintenir les proportions
            const videoRatio = video.videoWidth / video.videoHeight;
            const canvasRatio = canvas.width / canvas.height;

            let drawWidth,
              drawHeight,
              offsetX = 0,
              offsetY = 0;

            if (videoRatio > canvasRatio) {
              // La vidéo est plus large que le canvas
              drawHeight = canvas.height;
              drawWidth =
                video.videoWidth * (canvas.height / video.videoHeight);
              offsetX = (canvas.width - drawWidth) / 2;
            } else {
              // La vidéo est plus haute que le canvas
              drawWidth = canvas.width;
              drawHeight =
                video.videoHeight * (canvas.width / video.videoWidth);
              offsetY = (canvas.height - drawHeight) / 2;
            }

            // Dessiner la vidéo sur le canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(video, offsetX, offsetY, drawWidth, drawHeight);

            // Dessiner le rectangle guide pour la carte
            const guideRect = drawCardGuide(ctx, canvas.width, canvas.height);

            // Traitement OpenCV
            if (!photoTaken) {
              let src = openCv.imread(canvas);
              let gray = new openCv.Mat();
              openCv.cvtColor(src, gray, openCv.COLOR_RGBA2GRAY);

              // Détecter le visage
              const faceRect = await detectFace(src, gray);

              if (faceRect) {
                // Détecter les yeux
                await detectEyes(src, faceRect);

                // Extrapoler et dessiner le rectangle de la carte si l'option est activée
                const cardRect = extrapolateCardRectangle(faceRect);
                if (showCard) {
                  let pt1 = new openCv.Point(cardRect.x, cardRect.y);
                  let pt2 = new openCv.Point(
                    cardRect.x + cardRect.width,
                    cardRect.y + cardRect.height
                  );
                  openCv.rectangle(src, pt1, pt2, [255, 165, 0, 255], 2);
                }

                // Capture automatique si un visage est détecté
                if (autoCaptureEnabled && !photoTaken) {
                  // Vérifier si le visage est bien positionné par rapport au guide
                  const cardCenterX = cardRect.x + cardRect.width / 2;
                  const cardCenterY = cardRect.y + cardRect.height / 2;
                  const guideCenterX = guideRect.x + guideRect.width / 2;
                  const guideCenterY = guideRect.y + guideRect.height / 2;

                  const distanceX = Math.abs(cardCenterX - guideCenterX);
                  const distanceY = Math.abs(cardCenterY - guideCenterY);

                  // Vérifier si toutes les métriques sont bonnes avant de capturer automatiquement
                  const alignmentResult = calculateAlignment(faceRect, cardRect);
                  const distanceResult = calculateDistance(cardRect);
                  const imageQuality = analyzeImageQuality();
                  
                  // Condition exactement comme dans index.html (card.js)
                  if (
                    alignmentResult.aligned &&
                    distanceResult.correct &&
                    imageQuality.variance >= VARIANCE_MIN &&
                    imageQuality.brightness >= BRIGHTNESS_MIN &&
                    imageQuality.brightness <= BRIGHTNESS_MAX &&
                    distanceX < 50 && distanceY < 50 &&
                    autoCaptureEnabled &&
                    !photoTaken
                  ) {
                    console.log("Conditions de capture automatique remplies:", {
                      alignment: alignmentResult.aligned,
                      distance: distanceResult.correct,
                      variance: imageQuality.variance,
                      brightness: imageQuality.brightness,
                      position: `X:${distanceX}, Y:${distanceY}`
                    });
                    capturePhoto('auto');
                  }
                }
              }

              // Afficher le résultat OpenCV
              openCv.imshow(canvas, src);
              src.delete();
              gray.delete();
            }
          } else {
            // Si la vidéo n'est pas prête, afficher un message
            ctx.fillStyle = "black";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.textAlign = "center";
            ctx.fillText(
              "Touchez l'écran pour activer la caméra",
              canvas.width / 2,
              canvas.height / 2
            );
          }

          // Continuer la boucle
          requestAnimationFrame(processVideo);
        } catch (e) {
          console.error("Erreur dans processVideo:", e);
          requestAnimationFrame(processVideo);
        }
      }
    </script>
