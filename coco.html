<html>
  <head>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
  </head>
  <body>
    <video id="webcam" width="640" height="480" autoplay></video>
    <canvas id="canvas" width="640" height="480"></canvas>

    <script>
      // Configuration initiale de la webcam
      async function setupWebcam() {
        const video = document.getElementById("webcam");
        const stream = await navigator.mediaDevices.getUserMedia({
          video: true,
        });
        video.srcObject = stream;
        return new Promise((resolve) => {
          video.onloadedmetadata = () => {
            resolve(video);
          };
        });
      }

      // Charger le modèle et détecter
      async function loadAndRunDetection() {
        const video = await setupWebcam();
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d");

        // Charger le modèle COCO-SSD
        const model = await cocoSsd.load();

        async function detectFrame() {
          // Détection d'objets dans la frame
          const predictions = await model.detect(video);

          // Dessiner l'image originale
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

          // Filtrer pour trouver une "carte" (approximation)
          predictions.forEach((prediction) => {
            // COCO-SSD n'a pas "carte d'identité", mais on peut chercher des objets rectangulaires similaires
            if (
              prediction.class === "book" ||
              prediction.class === "cell phone" ||
              prediction.score > 0.6
            ) {
              const [x, y, width, height] = prediction.bbox;

              // Dessiner un rectangle autour de l'objet détecté
              ctx.beginPath();
              ctx.rect(x, y, width, height);
              ctx.lineWidth = 2;
              ctx.strokeStyle = "red";
              ctx.fillStyle = "red";
              ctx.stroke();
              ctx.fillText(
                `${prediction.class} (${Math.round(prediction.score * 100)}%)`,
                x,
                y > 10 ? y - 5 : y + 15
              );

              // Simulation de segmentation basique : masquer tout sauf la zone détectée
              ctx.globalAlpha = 0.7;
              ctx.fillStyle = "gray";
              ctx.fillRect(0, 0, canvas.width, y); // Haut
              ctx.fillRect(
                0,
                y + height,
                canvas.width,
                canvas.height - y - height
              ); // Bas
              ctx.fillRect(0, y, x, height); // Gauche
              ctx.fillRect(x + width, y, canvas.width - x - width, height); // Droite
              ctx.globalAlpha = 1.0;
            }
          });

          requestAnimationFrame(detectFrame);
        }

        detectFrame();
      }

      // Démarrer l'application
      window.onload = () => {
        loadAndRunDetection().catch(console.error);
      };
    </script>
  </body>
</html>
