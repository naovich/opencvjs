<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Détection de visage avec extrapolation et alignement de la carte
    </title>
    <style>
      :root {
        --primary-color: #4caf50;
        --primary-hover: #45a049;
        --dark-color: #333;
        --light-bg: #f9f9f9;
        --border-color: #ddd;
        --radius: 8px;
        --shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        padding: 0;
        color: #333;
        background-color: #f5f5f5;
        overflow-x: hidden;
      }
      
      .wrapper {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 15px;
      }
      
      h1, h2 {
        margin-bottom: 1rem;
        color: var(--dark-color);
      }
      
      .container {
        display: flex;
        flex-direction: row;
        gap: 20px;
        margin: 20px 0;
        width: 100%;
      }
      
      @media (max-width: 900px) {
        .container {
          flex-direction: column;
        }
      }
      
      .section {
        border-radius: var(--radius);
        background-color: white;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      
      .section-header {
        padding: 15px;
        background-color: var(--dark-color);
        color: white;
        font-size: 1.2rem;
        font-weight: 500;
      }
      
      .section-content {
        padding: 20px;
      }
      
      .left-section,
      .right-section {
        flex: 1;
        min-width: 0; /* Empêche le débordement sur les petits écrans */
      }
      
      #canvas {
        max-width: 100%;
        height: auto;
        display: block;
        border-radius: var(--radius);
        margin-bottom: 15px;
      }
      
      .checkboxes {
        margin: 15px 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      
      .checkboxes label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 0.95rem;
        cursor: pointer;
      }
      
      .checkboxes input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--primary-color);
      }
      
      .right-section {
        display: flex;
        flex-direction: column;
      }
      
      #photoContainer {
        width: 100%;
        margin-bottom: 15px;
        display: flex;
        justify-content: center;
      }
      
      #photoCanvas {
        max-width: 100%;
        height: auto;
        border-radius: var(--radius);
        border: 1px solid var(--border-color);
      }
      
      button {
        padding: 12px 20px;
        font-size: 1rem;
        cursor: pointer;
        border: none;
        border-radius: var(--radius);
        background-color: var(--primary-color);
        color: white;
        transition: background-color 0.3s, transform 0.2s;
        margin-bottom: 10px;
        font-weight: 500;
      }
      
      button:hover {
        background-color: var(--primary-hover);
        transform: translateY(-2px);
      }
      
      button:active {
        transform: translateY(0);
      }
      
      .nav-menu {
        background-color: var(--dark-color);
        margin-bottom: 20px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }
      
      .nav-menu ul {
        list-style-type: none;
        display: flex;
        justify-content: flex-start;
        padding: 0 15px;
        height: 60px;
      }
      
      .nav-menu li {
        display: flex;
        align-items: center;
      }
      
      .nav-menu a {
        color: white;
        text-decoration: none;
        font-size: 1rem;
        padding: 0 20px;
        height: 60px;
        display: flex;
        align-items: center;
        transition: background-color 0.3s;
      }
      
      .nav-menu a:hover {
        background-color: rgba(255,255,255,0.1);
      }
      
      .nav-menu a.active {
        background-color: var(--primary-color);
        font-weight: 500;
      }
      
      .metrics {
        background-color: white;
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      
      .metric-row {
        padding: 12px 15px;
        border-bottom: 1px solid var(--border-color);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      
      .metric-row:last-child {
        border-bottom: none;
      }
      
      .metric-row p {
        margin: 0;
        display: flex;
        justify-content: space-between;
        width: 100%;
      }
      
      .metric {
        font-weight: 500;
      }
      
      .status-good {
        color: #4caf50;
      }
      
      .status-warning {
        color: #ff9800;
      }
      
      .status-bad {
        color: #f44336;
      }
      
      .debug-info {
        margin-top: 20px;
        padding: 15px;
        background-color: white;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
      }
      
      #video {
        display: none;
      }
    </style>
  </head>
  <body>
    <nav class="nav-menu">
      <div class="wrapper">
        <ul>
          <li><a href="index.html" class="active">Prise de photo</a></li>
          <li><a href="analyse.html">Analyse d'image</a></li>
        </ul>
      </div>
    </nav>
    
    <div class="wrapper">
      <h1>Détection de visage et alignement de la carte</h1>
      
      <div class="container">
        <div class="left-section section">
          <div class="section-header">Caméra en direct</div>
          <div class="section-content">
            <canvas
              id="canvas"
              width="640"
              height="480"
              willReadFrequently="true"
            ></canvas>
            
            <div class="checkboxes">
              <label>
                <input type="checkbox" id="showGuide" checked />
                Afficher le guide
              </label>
              <label>
                <input type="checkbox" id="showDebug" />
                Afficher les infos debug
              </label>
              <label>
                <input type="checkbox" id="useContourDetection" />
                Utiliser la détection de contour
              </label>
              <label>
                <input type="checkbox" id="showEyes" checked />
                Afficher la détection des yeux
              </label>
              <label>
                <input type="checkbox" id="autoCapture" checked />
                Prise automatique de photo
              </label>
            </div>
            
            <div class="metrics">
              <div class="metric-row">
                <p>
                  Angle de la carte:
                  <span id="cardAngleValue" class="metric">-</span>
                </p>
              </div>
              <div class="metric-row">
                <p>
                  Alignement visage-carte:
                  <span id="alignmentValue" class="metric">-</span>
                </p>
              </div>
              <div class="metric-row">
                <p>
                  Distance caméra-carte:
                  <span id="distanceValue" class="metric">-</span>
                </p>
              </div>
              <div class="metric-row">
                <p>
                  Luminosité:
                  <span id="brightnessValue" class="metric">-</span>
                </p>
              </div>
              <div class="metric-row">
                <p>
                  Variance (netteté):
                  <span id="varianceValue" class="metric">-</span>
                </p>
              </div>
              <div class="metric-row">
                <p>
                  Statut global:
                  <span id="resultStatus" class="metric">-</span>
                </p>
              </div>
              <div class="metric-row">
                <p>
                  Alignement de la carte:
                  <span id="eyesAlignmentValue" class="metric">-</span>
                </p>
              </div>
            </div>
          </div>
        </div>
        
        <div class="right-section section">
          <div class="section-header">Photo prise</div>
          <div class="section-content">
            <div id="photoContainer">
              <canvas id="photoCanvas" width="1280" height="960"></canvas>
            </div>
            <button id="manualCapture">Prendre la photo manuellement</button>
            <button id="retakePhoto" style="display: none">
              Reprendre la photo
            </button>
          </div>
        </div>
      </div>
    </div>
    
    <video
      id="video"
      width="${CAPTURE_WIDTH}"
      height="${CAPTURE_HEIGHT}"
      autoplay
      style="display: none"
    ></video>
    
    <script src="src/js/card.js"></script>
    <script
      async
      src="https://docs.opencv.org/4.11.0/opencv.js"
      onload="onOpenCvReady();"
    ></script>
  </body>
</html>
