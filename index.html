<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Détection de visage avec extrapolation et alignement de la carte
    </title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }
      .container {
        display: flex;
        gap: 20px;
        margin: 20px 0;
      }
      .left-section,
      .right-section {
        flex: 1;
        padding: 10px;
        border: 1px solid #ddd;
        border-radius: 5px;
        background-color: #f9f9f9;
      }
      .checkboxes {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .checkboxes label {
        display: flex;
        align-items: center;
        gap: 5px;
      }
      .right-section {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      button {
        padding: 10px 20px;
        font-size: 16px;

        cursor: pointer;
        border: none;
        border-radius: 5px;
        background-color: #4caf50;
        color: white;
        transition: background-color 0.3s;
      }
      button:hover {
        background-color: #45a049;
      }
      #photoCanvas {
        border: 1px solid #ccc;
        border-radius: 5px;
      }
      .nav-menu {
        background-color: #333;
        padding: 15px 0;
        margin-bottom: 20px;
      }
      .nav-menu ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        gap: 20px;
      }
      .nav-menu a {
        color: white;
        text-decoration: none;
        font-size: 16px;
        padding: 8px 15px;
        border-radius: 4px;
        transition: background-color 0.3s;
      }
      .nav-menu a:hover {
        background-color: #555;
      }
      .nav-menu a.active {
        background-color: #4caf50;
      }
      .metrics {
        margin-top: 50px;
        background-color: #f5f5f5;
        border-radius: 5px;
      }
      .metric-row {
        border-bottom: 1px solid #ddd;
      }
      .status-good {
        color: green;
      }
      .status-warning {
        color: orange;
      }
      .status-bad {
        color: red;
      }
      .debug-info {
        margin-top: 20px;
        padding: 10px;
        background-color: #f5f5f5;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <nav class="nav-menu">
      <ul>
        <li><a href="index.html" class="active">Prise de photo</a></li>
        <li><a href="analyse.html">Analyse d'image</a></li>
      </ul>
    </nav>
    <h1>Détection de visage et alignement de la carte</h1>
    <div class="container">
      <div class="left-section">
        <canvas
          id="canvas"
          width="640"
          height="480"
          willReadFrequently="true"
        ></canvas>
        <div class="checkboxes">
          <label
            ><input type="checkbox" id="showGuide" checked /> Afficher le
            guide</label
          >
          <label
            ><input type="checkbox" id="showDebug" /> Afficher les infos
            debug</label
          >
          <label
            ><input type="checkbox" id="useContourDetection" /> Utiliser la
            détection de contour</label
          >
          <label
            ><input type="checkbox" id="showEyes" checked /> Afficher la
            détection des yeux</label
          >
          <label
            ><input type="checkbox" id="autoCapture" checked /> Prise
            automatique de photo</label
          >
        </div>
        <div>
          <div class="metrics">
            <div class="metric-row">
              <p>
                Angle de la carte:
                <span id="cardAngleValue" class="metric">-</span>
              </p>
            </div>
            <div class="metric-row">
              <p>
                Alignement visage-carte:
                <span id="alignmentValue" class="metric">-</span>
              </p>
            </div>
            <div class="metric-row">
              <p>
                Distance caméra-carte:
                <span id="distanceValue" class="metric">-</span>
              </p>
            </div>
            <div class="metric-row">
              <p>
                Luminosité: <span id="brightnessValue" class="metric">-</span>
              </p>
            </div>
            <div class="metric-row">
              <p>
                Variance (netteté):
                <span id="varianceValue" class="metric">-</span>
              </p>
            </div>
            <div class="metric-row">
              <p>
                Statut global: <span id="resultStatus" class="metric">-</span>
              </p>
            </div>
            <div class="metric-row">
              <p>
                Alignement de la carte:

                <span id="eyesAlignmentValue" class="metric">-</span>
              </p>
            </div>
          </div>
        </div>
      </div>
      <div class="right-section">
        <h2>Photo prise</h2>
        <div id="photoContainer">
          <canvas id="photoCanvas" width="1280" height="960"></canvas>
        </div>
        <button id="manualCapture">Prendre la photo manuellement</button>
        <button id="retakePhoto" style="display: none">
          Reprendre la photo
        </button>
      </div>
    </div>
    <video
      id="video"
      width="${CAPTURE_WIDTH}"
      height="${CAPTURE_HEIGHT}"
      autoplay
      style="display: none"
    ></video>
    <script src="src/js/card.js"></script>
    <script
      async
      src="https://docs.opencv.org/4.11.0/opencv.js"
      onload="onOpenCvReady();"
    ></script>
  </body>
</html>
